[project]
name = "asedio"
version = "0.1.0"
description = "Automated red-team harness — attack battery, deterministic checks, severity, zero-regression loop"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asedio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
